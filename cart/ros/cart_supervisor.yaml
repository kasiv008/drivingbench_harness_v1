# cart_supervisor parameters. Values marked CALIBRATE must be measured on your cart.

cart_supervisor:
  ros__parameters:
    mode: llm                 # llm | calib
    calib_throttle: 0.0       # calib mode only: throttle held after the kick (or from rest if no kick)
    calib_kick_throttle: 0.0  # e.g. 0.38: applied until calib_kick_speed, then drops to calib_throttle. 0 = off
    calib_kick_speed: 0.3

    # Button and axis indices are in controller.yaml (shared with joystick_demo)
    trigger_deadband: 0.05
    stick_override: 0.2

    # Freshness limits [s]
    joy_timeout: 0.25         # needs joy_node autorepeat_rate >= 20
    joy_cmd_timeout: 0.25
    report_timeout: 0.3
    target_timeout: 0.2

    # Brake band of this cart
    brake_min: 0.5
    brake_cap: 1.1
    hold_brake: 0.8           # CALIBRATE: holds the cart on your steepest slope
    stop_brake: 0.8           # CALIBRATE: stopping from max LLM speed feels acceptable
    kb: 0.5

    # Speed loop. Fitted to calib and speed-test runs on 2026-10-15:
    # throttle sets acceleration (~4.6 m/s^2 per unit), breakaway 0.35, sustain 0.32-0.34.
    throttle_cap: 0.70        # with this cart, limits acceleration rather than top speed
    throttle_slew: 0.5        # throttle units per second
    throttle_start: 0.30      # below this nothing moves: jump straight here
    kp: 0.12
    ki: 0.03
    i_max: 1.0
    i_band: 0.2               # integrate only within this speed error [m/s]
    brake_band: 0.3           # m/s over target before the loop brakes
    breakaway_throttle: 0.36  # minimum throttle below breakaway_speed. 0 = off
    breakaway_speed: 0.15
    ff_speeds: [0.5, 1.0, 1.5]
    ff_throttle: [0.325, 0.4, 0.45]   # 1.0 measured, 1.5 extrapolated
    max_speed_mps: 2.0        # hard brake above this while the LLM has (or just had) authority
    standstill_speed: 0.05
    speed_tau: 0.25           # speed low-pass [s]. Raw speed alternated +-0.5 m/s near 1 m/s

    # Grade trim. The table above is for flat ground: downhill it overshoots until the brake
    # band, uphill or at full lock it stalls below target. This learns a bounded throttle bias
    # from sustained speed error and keeps it across stops. UNTESTED ON THE CART: tune here.
    kp_over: 0.3              # gain while above target: -0.2 m/s cuts throttle below throttle_start
    trim_gain: 0.15           # throttle/s per m/s of error. 0 = off (old behaviour)
    trim_max: 0.08            # bias limit, about +-0.37 m/s^2
    trim_band: 0.1            # ignore errors smaller than this [m/s]
    trim_accel: 0.1           # learn only while not already converging faster than this [m/s^2]
    trim_accel_tau: 0.5
    trim_stall_s: 2.0         # not rolling this long with a target: add throttle (uphill start)
    brake_band_downhill: 0.15 # once the trim is at -trim_max the cart rolls with no throttle: brake sooner

    # Per-tick CSV log: targets, measured speed/steering, commanded and reported pedals, loop
    # internals, operator inputs. About 33 Hz, ~25 MB per hour, one file per start. "" = off.
    log_dir: "~/drivingbench-cart/logs"

    # Steering (radians of steering-wheel angle, same as joystick_demo)
    steer_sign: 1.0           # +1: positive command turns left (matches your flipped joystick)
    max_steer_rad: 9.9        # >= radians(max_steering_angle_deg 564). Measured lock +-10.94 rad
    steer_vel_llm: 3.0        # rad/s, about the joystick rate (pi)

    # PACMod reports. Check names and types with: ros2 topic list | grep pacmod ; ros2 topic type <topic>
    speed_topic: /pacmod/parsed_tx/vehicle_speed_rpt
    speed_type: pacmod_msgs/VehicleSpeedRpt
    speed_field: vehicle_speed          # e.g. data for std_msgs/Float64, twist.twist.linear.x for Odometry
    steer_rpt_topic: /pacmod/parsed_tx/steer_rpt
    steer_rpt_type: pacmod_msgs/SystemRptFloat
    accel_rpt_topic: /pacmod/parsed_tx/accel_rpt
    accel_rpt_type: pacmod_msgs/SystemRptFloat
    brake_rpt_topic: /pacmod/parsed_tx/brake_rpt
    brake_rpt_type: pacmod_msgs/SystemRptFloat
    shift_rpt_topic: /pacmod/parsed_tx/shift_rpt
    shift_rpt_type: pacmod_msgs/SystemRptInt
    gear_forward_value: 3     # CALIBRATE: shift report output when in forward
    use_enabled_topic: true   # false: derive "enabled" from the steer/accel/brake reports
    enabled_topic: /pacmod/as_tx/enable
    use_system_enabled: false  # this cart: steer_rpt.enabled reads false while PACMod is enabled

    # Topic namespaces and UDP link to cart_bridge.py
    joy_cmd_ns: /joy_cmd
    out_ns: /pacmod/as_rx
    bridge_port: 47801
    target_port: 47802
    ignore: false
